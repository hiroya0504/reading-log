spring:
  application:
    name: reading-log
  config:
    # Local secrets (GOOGLE_BOOKS_API_KEY) live in backend/.env, which .gitignore keeps out of git.
    # Optional: CI and anyone without the file run without it.
    import: optional:file:.env[.properties]
  datasource:
    # Host port 5433 — see docker-compose.yml (5432 is taken by another local project).
    url: ${DB_URL:jdbc:postgresql://localhost:5433/reading_log}
    username: ${DB_USERNAME:reading}
    password: ${DB_PASSWORD:reading}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

google-books:
  base-url: https://www.googleapis.com/books/v1
  # Without a key Google counts requests against a quota shared by everyone and it is usually
  # exhausted, so searching effectively needs one. See docs/architecture.md.
  api-key: ${GOOGLE_BOOKS_API_KEY:}
  timeout: 5s

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  # Keep the generated contract stable across runs: without this, springdoc emits paths
  # in HashMap order and docs/openapi.json churns on every regeneration.
  writer-with-order-by-keys: true

server:
  port: ${SERVER_PORT:8080}
