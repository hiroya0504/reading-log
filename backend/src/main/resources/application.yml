spring:
  application:
    name: reading-log
  datasource:
    # Host port 5433 — see docker-compose.yml (5432 is taken by another local project).
    url: ${DB_URL:jdbc:postgresql://localhost:5433/reading_log}
    username: ${DB_USERNAME:reading}
    password: ${DB_PASSWORD:reading}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  # Keep the generated contract stable across runs: without this, springdoc emits paths
  # in HashMap order and docs/openapi.json churns on every regeneration.
  writer-with-order-by-keys: true

server:
  port: ${SERVER_PORT:8080}
